name: ci

on:
  push:
    branches:
      - main
      - "cursor**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Archidekt connector dependencies
        run: pip install -e services/archidekt-connector

      - name: TypeScript checks
        run: npm run typecheck

      - name: TypeScript tests
        run: npm run test:ts

      - name: API smoke test
        run: npm run api:smoke

      - name: ArenaC build
        run: npm run arenac:build

      - name: Rust tests
        run: cargo test --workspace

      - name: ArenaC smoke test
        run: npm run arenac:smoke

      - name: Python tests
        run: python3 -m unittest discover -s services/archidekt-connector/tests -p 'test_*.py'
