name: ci

on:
  push:
    branches:
      - main
      - "cursor**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Archidekt connector dependencies
        run: pip install -e services/archidekt-connector

      - name: TypeScript checks
        run: npm run typecheck

      - name: TypeScript tests
        run: npm run test:ts

      - name: PaperC quality gate
        run: npm run paperc:quality

      - name: Install Overwolf app dependencies
        run: npm install --prefix apps/overwolf

      - name: Build Overwolf bundle
        run: npm run build --prefix apps/overwolf

      - name: API smoke test
        run: npm run api:smoke

      - name: ArenaC build
        run: npm run arenac:build

      - name: Rust tests
        run: cargo test --workspace

      - name: ArenaC serve smoke (HTTP API)
        run: npm run overwolf:smoke

      - name: ArenaC smoke test
        run: npm run arenac:smoke

      - name: Python tests
        run: python3 -m unittest discover -s services/archidekt-connector/tests -p 'test_*.py'

  overwolf_package_windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root Node dependencies
        run: npm ci

      - name: Build mancutg-arenac (release)
        run: cargo build -p mancutg-arenac --release

      - name: Install Overwolf app dependencies
        run: npm install --prefix apps/overwolf

      - name: Build Overwolf bundle
        run: npm run build --prefix apps/overwolf

      - name: Package Overwolf zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-overwolf.ps1

      - name: Upload Overwolf package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mancutg-arenac-overwolf-zip
          path: mancutg-arenac-overwolf-0.1.0.zip
