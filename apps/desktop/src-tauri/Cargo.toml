[package]
name = "mancutg-arenac"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mancutg-arenac"
path = "src/main.rs"

[[bin]]
name = "mancutg-arenac-cli"
path = "src/cli_main.rs"

[dependencies]
core-parser = { path = "../../../crates/core-parser" }
core-store = { path = "../../../crates/core-store" }
core-domain = { path = "../../../crates/core-domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
